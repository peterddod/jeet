[package]
name = "plete"
version = "0.15.0"
edition = "2021"
description = "Global git repo index and worktree manager"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "unstable-ext"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
dirs = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.1"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
ratatui = "0.30"
unicode-width = "0.2"
serde_json = "1"
ureq = { version = "3.4", features = ["json"] }
keyring = "4.2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }

[dev-dependencies]
tempfile = "3"

[target."cfg(unix)".dependencies]
signal-hook = { version = "0.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[package.metadata.deb]
maintainer = "Peter <peterddod@users.noreply.github.com>"
copyright = "2026, plete contributors"
license-file = ["LICENSE", "4"]
extended-description = """\
plete manages a canonical store of git repository trunks, mirrors worktrees \
under a predictable layout, and maintains a SQLite index for discovery."""
depends = "$auto, git, tmux"
provides = "jeet"
replaces = "jeet"
conflicts = "jeet"
recommends = "bash-completion"
section = "utility"
priority = "optional"
assets = [
    ["target/release/plete", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/plete/README", "644"],
    ["packaging/completions/plete.bash", "usr/share/bash-completion/completions/plete", "644"],
    ["packaging/completions/_plete", "usr/share/zsh/vendor-completions/_plete", "644"],
    ["packaging/completions/_plete", "usr/share/zsh/site-functions/_plete", "644"],
    ["packaging/completions/plete.fish", "usr/share/fish/vendor_completions.d/plete.fish", "644"],
]
