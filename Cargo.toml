[package]
name = "jeet"
version = "0.2.1"
edition = "2021"
description = "Global git repo index and worktree manager"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "unstable-ext"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "Peter <peterddod@users.noreply.github.com>"
copyright = "2026, jeet contributors"
license-file = ["LICENSE", "4"]
extended-description = """\
jeet manages a canonical store of git repository trunks, mirrors worktrees \
under a predictable layout, and maintains a SQLite index for discovery."""
depends = "$auto, git"
section = "utility"
priority = "optional"
assets = [
    ["target/release/jeet", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/jeet/README", "644"],
]
